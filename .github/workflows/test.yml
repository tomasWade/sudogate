name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # cmd/sudogate-server go:embed 内嵌密钥文件，构建前需就位；
      # CI 生成一次性假密钥即可（不用于任何真实部署）
      - name: Generate throwaway keys for embedding
        run: |
          mkdir -p keys
          openssl genpkey -algorithm ed25519 -out keys/laptop.key
          openssl pkey -in keys/laptop.key -pubout -out keys/laptop.pub
          make inject

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
